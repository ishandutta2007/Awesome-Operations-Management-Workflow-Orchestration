<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.7; }
      50% { r: 8; opacity: 1; }
    }
    .bg-grid { fill: url(#cyberGrid); }
    .orb-purple { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 220px 90px; }
    .orb-cyan { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 980px 240px; }
    .flow-line { stroke-dasharray: 8 6; animation: flowDash 3s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6 8; animation: flowDash 4s linear infinite reverse; }
    .card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-2 { animation: floatCard2 6s ease-in-out infinite; }
    .pulse-dot { animation: pulseNode 2.5s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  <rect width="100%" height="100%" class="bg-grid"/>

  <!-- Ambient Dynamic Orbs (Background layer) -->
  <circle cx="220" cy="90" r="160" fill="#6366f1" filter="url(#glow)" class="orb-purple"/>
  <circle cx="980" cy="240" r="180" fill="#06b6d4" filter="url(#glow)" class="orb-cyan"/>
  <circle cx="600" cy="180" r="120" fill="#8b5cf6" filter="url(#glow)" opacity="0.18"/>

  <!-- Dynamic Orchestration Pipeline Visuals in Background -->
  <g opacity="0.4">
    <!-- Connecting flow wires -->
    <path d="M 100 80 Q 300 20 600 80 T 1100 90" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line"/>
    <path d="M 80 280 Q 400 340 700 270 T 1120 280" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line-rev"/>
    <path d="M 150 180 C 350 300, 850 60, 1050 180" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" class="flow-line"/>
    
    <!-- Dynamic Workflow Nodes -->
    <circle cx="350" cy="65" r="6" fill="#ec4899" class="pulse-dot"/>
    <circle cx="600" cy="80" r="6" fill="#8b5cf6" class="pulse-dot" style="animation-delay: 0.8s;"/>
    <circle cx="850" cy="85" r="6" fill="#06b6d4" class="pulse-dot" style="animation-delay: 1.6s;"/>
  </g>

  <!-- Floating Dynamic Tech Cards (Subtle Background Sides) -->
  <!-- Left Side Card -->
  <g class="card-1" opacity="0.65">
    <rect x="40" y="110" width="185" height="75" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="65" cy="135" r="8" fill="#10b981"/>
    <text x="82" y="140" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">BPMN &amp; Approvals</text>
    <rect x="65" y="156" width="125" height="8" rx="4" fill="#334155"/>
    <rect x="65" y="156" width="90" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Right Side Card -->
  <g class="card-2" opacity="0.65">
    <rect x="975" y="110" width="185" height="75" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="1000" cy="135" r="8" fill="#6366f1"/>
    <text x="1017" y="140" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">Durable Execution</text>
    <rect x="1000" y="156" width="125" height="8" rx="4" fill="#334155"/>
    <rect x="1000" y="156" width="100" height="8" rx="4" fill="#6366f1"/>
  </g>

  <!-- FOREGROUND: High Contrast & Perfectly Readable Text -->
  <g>
    <!-- Top Pill Badge -->
    <g transform="translate(435, 46)">
      <rect x="0" y="0" width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.92" stroke="url(#primaryGlow)" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="21" fill="#e0e7ff" font-size="13" font-family="sans-serif" font-weight="600" letter-spacing="0.8">OPERATIONS &amp; WORKFLOW 2026</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="42" fill="url(#primaryGlow)" filter="drop-shadow(0px 3px 12px rgba(0,0,0,0.85))">
      Operations Management &amp; Workflow Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="sub-text" font-size="18" fill="#cbd5e1" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.9))">
      Curated Directory of Enterprise SaaS Suites &amp; Open-Source Distributed Workflow Engines
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(255, 240)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="155" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
      <text x="77" y="23" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="sans-serif" font-weight="600">⚡ Durable Workflows</text>
      
      <!-- Tag 2 -->
      <rect x="175" y="0" width="155" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
      <text x="252" y="23" text-anchor="middle" fill="#c084fc" font-size="13" font-family="sans-serif" font-weight="600">📋 BPMN &amp; Approvals</text>

      <!-- Tag 3 -->
      <rect x="350" y="0" width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
      <text x="430" y="23" text-anchor="middle" fill="#6ee7b7" font-size="13" font-family="sans-serif" font-weight="600">🔄 Cross-Team Ops</text>

      <!-- Tag 4 -->
      <rect x="530" y="0" width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
      <text x="610" y="23" text-anchor="middle" fill="#f472b6" font-size="13" font-family="sans-serif" font-weight="600">🤖 Event-Driven &amp; AI</text>
    </g>
  </g>
</svg>
